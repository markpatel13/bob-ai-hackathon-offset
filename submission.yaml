submission:
  title: "Drug Safety Signal Detector"                           # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >
    Millions of adverse drug event reports are collected in the FDA database,
    making it difficult to identify unusual drug-reaction patterns early.
    Pharmacovigilance teams need a way to detect potentially important safety
    signals from large volumes of real-world adverse event reports.

  solution_summary: >
    Drug Safety Signal Detector analyzes publicly available FDA adverse event
    reports and calculates the Proportional Reporting Ratio (PRR) for drug-reaction
    pairs. It identifies and ranks disproportionate reporting signals, visualizes
    trends over time, and provides plain-English summaries to help users interpret
    potential safety signals.

  key_features:
    - "Search and filter FDA adverse event reports by drug and reaction"
    - "PRR-based statistical signal detection for drug-reaction pairs"
    - "Ranked safety signal dashboard showing signal strength and report counts"
    - "Trend visualization showing adverse-event report volume over time"
    - "Plain-English AI-generated summaries of detected safety signals"

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas","NumPy","SciPy","Plotly","Requests","openFDA API","GitHub","GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

   what_we_are_most_proud_of: >
    Our strongest aspect is the combination of real FDA adverse event data with
    a transparent and explainable PRR-based statistical method. The dashboard
    turns large-scale adverse-event data into ranked safety signals and
    understandable visual insights while clearly distinguishing statistical
    signals from confirmed causal relationships.

  known_limitations: >
    The system identifies statistical reporting signals and does not establish
    that a drug caused a particular adverse reaction. Results can be affected
    by reporting bias, missing data, duplicate reports, and differences in
    reporting practices. The prototype is intended to support pharmacovigilance
    analysis rather than replace expert medical or regulatory assessment.

